# Next-step prediction bundle: inserts the host half. The package also declares
# `dsh.client`, so the web GUI loads its browser half from `./client`.
- insert:
    - id: nextstep
      name: dsh-plugin-nextstep
      config:
        enabled: true
        provider: ''
        model: ''
        contextMessages: 12
        maxContextChars: 24000
        maxTokens: 512
        temperature: 0
        timeoutMs: 60000
        sampleRate: 1
        minTurn: 1
